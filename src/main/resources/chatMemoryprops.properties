
Application · PROPERTIES
# =====================================================================
# CHAT MEMORY CONFIGURATION REFERENCE
# Pick ONE repository option (LAYER 1: where messages are stored).
# The window size is set in Java (ChatMemoryConfig: maxMessages = 10).
# =====================================================================

# ---------------------------------------------------------------------
# OPTION A: In-memory (default). Nothing to configure.
#   - Auto-configured InMemoryChatMemoryRepository
#   - Fastest, zero setup
#   - LOST ON RESTART, and not shared between multiple app instances
#   - Use for: demos, local development, tests
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# OPTION B: JDBC (recommended for real applications)
#
# 1) Add dependencies (Maven):
#    <dependency>
#      <groupId>org.springframework.ai</groupId>
#      <artifactId>spring-ai-starter-model-chat-memory-repository-jdbc</artifactId>
#    </dependency>
#    + your JDBC driver (postgresql, mysql, h2, oracle, ...)
#
# 2) Configure the datasource and let Spring AI create the table
#    (SPRING_AI_CHAT_MEMORY) on startup:
# ---------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
# spring.datasource.username=postgres
# spring.datasource.password=secret
#
# always  = create the table at every startup (safe if it already exists)
# embedded = only for embedded DBs like H2 (default)
# never   = you manage the schema yourself (use this in production with Flyway/Liquibase)
# spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# H2 file database example (survives restarts, good for learning):
# spring.datasource.url=jdbc:h2:file:~/chatmemory;AUTO_SERVER=true
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# ---------------------------------------------------------------------
# OPTION C: Cassandra
#   artifact: spring-ai-starter-model-chat-memory-repository-cassandra
#   spring.ai.chat.memory.cassandra.keyspace=springframework
#   spring.ai.chat.memory.cassandra.table=ai_chat_memory
#   spring.ai.chat.memory.cassandra.initialize-schema=true
#   Use for: very high write volume, multi-region
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# OPTION D: Neo4j
#   artifact: spring-ai-starter-model-chat-memory-repository-neo4j
#   Use for: when you already run Neo4j and want conversations as graph data
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# OPTION E: Your own repository
#   Implement ChatMemoryRepository and register it as a @Bean/@Component
#   (see LoggingChatMemoryRepository). Yours replaces the default.
#   Activate the demo with: --spring.profiles.active=logging-memory
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Optional: see what actually goes to the model (very useful for learning
# the difference between message-based and prompt-based memory)
# ---------------------------------------------------------------------
# logging.level.org.springframework.ai.chat.client.advisor=DEBUG

